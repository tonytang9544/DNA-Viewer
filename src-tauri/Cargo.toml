[package]
name = "molecular-cloning-studio"
version = "0.1.0"
description = "Desktop molecular cloning and DNA analysis workspace"
authors = ["you"]
edition = "2021"

[lib]
name = "molecular_cloning_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gb-io = { version = "0.9", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
