name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate frontend and Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget file build-essential libayatana-appindicator3-dev libxdo-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  desktop-build:
    name: Build desktop app (${{ matrix.os }}, ${{ matrix.bundle }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
          - os: ubuntu-latest
            bundle: deb
          - os: windows-latest
            bundle: msi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget file build-essential libayatana-appindicator3-dev libxdo-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev
      - run: npm ci
      - run: npm run tauri build -- --bundles ${{ matrix.bundle }}
